    <noscript><main><h1>Nick's story so far</h1><p>I grew up in South Carolina playing basketball. I finished high school with a 4.0 GPA and graduated during COVID without a set plan. In my first two years of college, crypto and the technology behind NFTs caught my interest. I launched The Tribe, now Primate Trading, a financial services business that generated over $150,000 in revenue. After two or three years, I missed face-to-face interaction and joined an accounting firm helping HVAC businesses with financial planning and analysis. Today I’m studying for the CMA, learning about statistics and markets, and trading index futures in my own live account. In August 2026, I founded Sumlino, a browser assistant for accountants working through month-end close in QuickBooks. I found things I enjoyed, then kept building on them.</p><a href="/">Return home</a></main></noscript>
